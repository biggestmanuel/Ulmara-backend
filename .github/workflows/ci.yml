name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    # config/env.ts and prisma7.config.ts resolve these at load time (even
    # `prisma generate` needs DATABASE_URL), yet every DB/Redis touchpoint in
    # the suite is mocked and no real connection is ever made — so CI-only
    # dummies are sufficient and no real secrets live here.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-used-for-anything-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated (and gitignored), so tests that import
      # the schema's types need it regenerated before vitest runs.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
