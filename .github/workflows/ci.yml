name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated (and gitignored), so tests that import
      # the schema's types need it regenerated before vitest runs.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # config/env.ts validates process.env at import time, so the suite needs
      # these defined even though every DB/Redis touchpoint is mocked in tests
      # and no real connection is ever made.
      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-only-secret-not-used-for-anything-real
