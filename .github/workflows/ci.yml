name: CI

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same branch are pointless; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    # config/env.ts and prisma7.config.ts resolve these at load time (even
    # `prisma generate` needs DATABASE_URL), yet every DB/Redis touchpoint in
    # the suite is mocked and no real connection is ever made — so CI-only
    # dummies are sufficient and no real secrets live here.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-not-used-for-anything-real-32
    services:
      # The OTP store is a real Redis integration suite (EX TTL, Lua
      # compare-and-delete, Lua attempt counter). A stub would not exercise
      # those, so CI runs a real Redis and the tests are not skipped.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated (and gitignored), so tests that import
      # the schema's types need it regenerated before vitest runs.
      - name: Generate Prisma client
        run: npx prisma generate

      # ESLint's type-aware rules need the same env the app does, otherwise
      # config/env.ts throws on import and every file fails to parse.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # A redis-server started outside the container silently shadows it for
      # anything running in this environment, and nothing about that looks like
      # a failure: PING answers, keys are there, the suite passes. This asserts
      # the eviction policy, because a policy that can evict job keys is the one
      # misconfiguration that would actually lose a queued transfer.
      #
      # REQUIRE_REDIS_CONTAINER=false: the CI service container is a bare
      # redis:7-alpine (AOF off), so the durability assertions would be
      # meaningless here — they are covered by `npm run verify:redis` against the
      # compose-managed local instance.
      - name: Install redis-cli for the preflight
        # The ubuntu-latest runner image does not ship redis-tools, so the
        # preflight below failed with "cannot reach Redis" while the service
        # container was healthy and every test had already passed. redis-cli was
        # never installed — the server was not missing.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools

      - name: Redis preflight (eviction policy)
        env:
          REQUIRE_REDIS_CONTAINER: "false"
        run: npm run preflight:redis

      - name: Prove the app works against a TLS + ACL Redis
        # A `rediss://` URL is a claim nothing else tests, and a managed Redis is
        # where three separate things break: the pub/sub channel grant is a
        # different ACL namespace from the key grant, a private CA needs
        # NODE_EXTRA_CA_CERTS set before the process starts, and the username in
        # the URL is mandatory. All three fail while a health check stays green.
        #
        # Self-contained: it starts its own throwaway Redis on 6380 with the
        # plaintext port disabled and `user default off`, generates its own
        # throwaway CA, and tears both down. It does not touch the service Redis
        # above; the separate compose file keeps it out of the default project.
        run: npm run verify:redis:tls

  migrations:
    name: Migration drift check
    runs-on: ubuntu-latest
    # Guards the release contract in README/OPERATIONS.md: a migration must
    # exist for every schema change, and it must apply cleanly to an empty
    # database. A schema edit that ships without a migration fails here rather
    # than in production.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/migrate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy

      - name: Status must be up to date after deploy
        run: npx prisma migrate status

      - name: Assert schema and migrations agree (no un-migrated drift)
        run: |
          # The diff runs AFTER `migrate deploy`, and reads the live database via
          # --from-config-datasource rather than the migrations directory.
          #
          # The obvious form is wrong under Prisma 7:
          #
          #     npx prisma migrate diff --from-migrations prisma/migrations ...
          #
          # which fails with "You must set `datasource.shadowDatabaseUrl` in your
          # `prisma.config.ts` if you want to diff a migrations directory". This
          # project has no shadow database configured, so that invocation ABORTS
          # INSTEAD OF DIFFING — the step fails, but it fails for the wrong reason
          # and would not have reported the drift it exists to catch. It was green
          # only because this job had never run.
          #
          # The service container above is a fresh, empty PostgreSQL that has been
          # migrated from nothing but prisma/migrations, so diffing the live schema
          # against the datamodel asks the same question: does the set of
          # migrations produce the declared schema?
          #
          # --exit-code makes an empty diff return 0 and a NON-empty diff return
          # non-zero, so a schema change with no matching migration fails here.
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code
