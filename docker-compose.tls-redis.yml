# A second Redis, isolated from the development instance on 6379, configured the
# way MANAGED Redis is: TLS only (the plaintext port is disabled entirely, not
# merely discouraged) plus ACL authentication with the default user turned OFF.
#
# It exists so `npm run verify:redis:tls` can answer a question that cannot be
# answered on the 6379 instance: does this application actually work against a
# TLS + ACL Redis, or only against an unauthenticated plaintext one? A connection
# string in `.env` is a claim; this is the test of it.
#
# Credentials below are throwaway local test values, committed on purpose so the
# verification is reproducible from a clean clone. They grant access to a
# container that holds nothing but test keys.
#
#   docker compose -f docker-compose.tls-redis.yml up -d
#   npm run verify:redis:tls
#
# The certificates are generated by scripts/verify-redis-tls-acl.sh into
# .tls-test-certs/ (gitignored) because a self-signed cert has no reason to live
# in version control.

services:
  avora-redis-tls:
    image: redis:7-alpine
    container_name: avora-redis-tls
    command:
      - redis-server
      - --port
      - "0" # no plaintext listener at all
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/server.crt
      - --tls-auth-clients
      - "no" # the server does not demand a client cert; see the note in the script
      - --aclfile
      - /certs/users.acl
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    ports:
      # Published on the host so a Node client reaches it over real TLS. The
      # certificate is issued for `localhost` and `127.0.0.1` by the script.
      - "127.0.0.1:6380:6380"
    volumes:
      - ./.tls-test-certs:/certs:ro
      - avora-redis-tls-data:/data
    healthcheck:
      # -p 0 is not supported as a probe, so the healthcheck goes over TLS with
      # the ACL user. If this passes, TLS and ACL are both genuinely working.
      test:
        - CMD
        - redis-cli
        - --tls
        # The CA that SIGNED the server certificate, not the server
        # certificate itself. Passing server.crt here fails the handshake with
        # "tlsv1 alert unknown ca" because the chain does not verify against a
        # leaf. Verified by hitting exactly that error before this was fixed.
        - --cacert
        - /certs/ca.crt
        - -h
        - localhost
        - -p
        - "6380"
        - --user
        - avora
        - --pass
        - avora-tls-test-password
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  avora-redis-tls-data:
